tools:
  - type: function
    function:
      name: go_to_page
      description: Navigate to a specified URL
      parameters:
        type: object
        properties:
          url:
            type: string
            description: The URL to navigate to.
        required:
          - url

  - type: function
    function:
      name: take_screenshot
      description: Take a screenshot of the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: click_element
      description: Perform a click interaction on an element
      parameters:
        type: object
        properties:
          selector:
            type: string
            description: The selector of the element to click.
        required:
          - selector

  - type: function
    function:
      name: form_details
      description: Get details of the forms on the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: links
      description: Get the links on the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: buttons
      description: Get the buttons on the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: submit_form
      description: Submit a form on the current page
      parameters:
        type: object
        properties:
          selector:
            type: string
            description: The selector of the form to submit.
        required:
          - selector

  - type: function
    function:
      name: get_page_source
      description: Get the page source of the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: get_current_url
      description: Get the current URL of the page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: fill_input
      description: Fill an input field with a specified value
      parameters:
        type: object
        properties:
          selector:
            type: string
            description: The selector of the input field to fill.
          value:
            type: string
            description: The value to fill in the input field.
        required:
          - selector
          - value

