tools:
  - type: function
    function:
      name: go_to_page
      description: Navigates to a specified URL
      parameters:
        type: object
        properties:
          url:
            type: string
            description: The URL to navigate to.
        required:
          - url

  - type: function
    function:
      name: take_screenshot
      description: Takes a screenshot of the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: click_element
      description: Clicks on an element specified by a selector
      parameters:
        type: object
        properties:
          selector:
            type: string
            description: The selector of the element to click.
        required:
          - selector

  - type: function
    function:
      name: form_details
      description: Retrieves details of the forms on the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: links
      description: Retrieves the links on the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: buttons
      description: Retrieves the buttons on the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: submit_form
      description: Submits a form specified by a selector
      parameters:
        type: object
        properties:
          selector:
            type: string
            description: The selector of the form to submit.
        required:
          - selector

  - type: function
    function:
      name: get_page_source
      description: Retrieves the page source of the current page
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: get_current_url
      description: Retrieves the current URL
      parameters:
        type: object
        properties: {}

  - type: function
    function:
      name: fill_input
      description: Fills an input field specified by a selector with a value
      parameters:
        type: object
        properties:
          selector:
            type: string
            description: The selector of the input field to fill.
          value:
            type: string
            description: The value to fill in the input field.
        required:
          - selector
          - value
          